# Image pin lives HERE, as an interpolation default, so `git pull` (or
# re-downloading this file) delivers the exact image this repository has
# tested. Set TF2_SERVER_IMAGE_VERSION in .env to run a different tag while
# the digest for it is fetched normally, or TF2_SERVER_IMAGE_TAG to replace
# the whole reference. CI (the Trivy scan and check-pin-freshness) reads the
# pin from this line: this block is the single source of truth.
#
# THE IMAGE IS THE RUNTIME, NOT THE GAME. LinuxGSM's tf2 image is rebuilt
# every week and carries what the server needs to run (the libraries, SteamCMD
# and python3); the game itself lives in the tf2-server-game volume and is
# brought to Steam's current build every time the server starts. LinuxGSM
# itself is not used: its update path trusts SteamCMD's own answer, which
# scripts/update-game.sh explains is not to be trusted. The tag is the game
# and carries no version; the digest is the version, the daily freshness job
# goes red when it moves, and the pin moves deliberately.
x-images:
  tf2-server: &tf2-server-image ${TF2_SERVER_IMAGE_TAG:-gameservermanagers/gameserver:${TF2_SERVER_IMAGE_VERSION:-tf2@sha256:7fda92c208cd5a40f3b172b8925979d70c4c9dd8e55229bfe67b31cadb00b7d7}}

services:
  tf2-server:
    image: *tf2-server-image
    # Not the image's entrypoint, which starts LinuxGSM: scripts/start-server.sh
    # brings the game to Steam's build with scripts/update-game.sh, then starts
    # it. On the first start that is the whole game, about 15 GB, and `docker
    # compose -p tf2 logs -f tf2-server` shows the download; after that it
    # compares build ids, a few seconds, and validates only when Steam has
    # moved on. A restart is therefore an update, which is how
    # tools/steam-uptodate.sh updates an empty server that has fallen behind.
    entrypoint: ["/bin/sh", "/start-server.sh"]
    # The uid the image's /data belongs to, so a new volume, which takes its
    # owner from the image's directory on first mount, is this user's.
    user: "1000:1000"
    # Handles untrusted input from the internet and cannot gain privileges
    # through a setuid binary.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 4g is measured, not guessed: a full 24-slot server peaked at 1.57 GB on
    # the machine this template comes from, and SteamCMD verifying the 15 GB
    # install before it peaked at 1.03 GB in CI. The ceiling is there so a leak here
    # cannot pick a victim elsewhere — with no limit the kernel's OOM killer
    # chooses by size, so the process it kills is rarely the one at fault.
    deploy:
      resources:
        limits:
          memory: ${TF2_SERVER_MEMORY_LIMIT:-4g}
          cpus: "${TF2_SERVER_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${TF2_SERVER_MEMORY_RESERVATION:-1g}
          cpus: "${TF2_SERVER_CPU_RESERVATION:-0.5}"
    ports:
      # THE NUMBER MUST MATCH INSIDE AND OUT. Steam's server list records the
      # port the server binds, not the one you forwarded. Publish 27016 for a
      # server bound on 27015 and the list hands players an address where a
      # different server answers: the connection succeeds, the handshake fails
      # against the wrong game, and every log line blames the client.
      - "${TF2_SERVER_PORT:-27015}:${TF2_SERVER_PORT:-27015}/udp"
      # rcon is TCP on the same number.
      - "${TF2_SERVER_PORT:-27015}:${TF2_SERVER_PORT:-27015}/tcp"
    # NO working_dir, AND NOTHING MOUNTED INSIDE THE GAME DIRECTORY. Docker
    # creates a missing working directory, and the parents of a bind mount's
    # target, inside the volume, owned by root. The first 2.0 candidate had
    # working_dir: /data/tf2, so on a fresh volume /data/tf2 belonged to root
    # before SteamCMD ran; SteamCMD, running as uid 1000, could not write it,
    # installed the 15 GB into its own library instead, and still printed
    # "Success! App '232250' fully installed." scripts/update-game.sh now
    # refuses a directory it cannot write, and the files below are mounted
    # under /config and linked into place by scripts/start-server.sh.
    # THE 64-BIT BINARY. `--net=host` hangs srcds at "Initializing Steam
    # libraries" on a host with more than one interface, with no error. This
    # container gets a bridge namespace of its own, which is why it starts.
    environment:
      # Steam's client library is looked for in ~/.steam/sdk64;
      # scripts/update-game.sh puts it there, in the game directory.
      HOME: /data/tf2
      # THE GAME GETS THE HOUSEHOLD CLOCK TOO, not only whatever sidecar
      # sits beside it. Every timestamp this server writes — bans, joins,
      # the crash it leaves behind — is read next to a log line from
      # somewhere else, and two clocks make that arithmetic. UTC by
      # default, which is a choice rather than an accident.
      TZ: ${TF2_SERVER_TIMEZONE:-UTC}
      # A Game Server Login Token, from https://steamcommunity.com/dev/managegameservers
      # (app id 440). Without one the server runs but stays off the public list,
      # which looks identical to a broken server from a player's side.
      TF2_SERVER_STEAM_TOKEN: ${TF2_SERVER_STEAM_TOKEN:?set in .env - see .env.example}
      TF2_SERVER_RCON_PASSWORD: ${TF2_SERVER_RCON_PASSWORD:?set in .env - see .env.example for generation command}
    command:
      - -game
      - tf
      - -console
      - -usercon
      - -port
      - "${TF2_SERVER_PORT:-27015}"
      # The token and the RCON password, from the file scripts/start-server.sh
      # writes from the two variables above. On this command line they were
      # readable by every user on the host for as long as the server ran.
      # Before +map, as the token itself was: the server logs in when it starts.
      - +exec
      - secrets.cfg
      - +maxplayers
      - "${TF2_SERVER_MAX_PLAYERS:-24}"
      - +map
      - "${TF2_SERVER_START_MAP:-koth_harvest_final}"
      - +sv_region
      - "${TF2_SERVER_REGION:-255}"
      # The hostname is NOT on this command line: the launcher drops everything
      # after a `|` in an argument, so a name like "Casual | 24/7" arrived as
      # "Casual". It lives in server.cfg, where the whole string survives.
    volumes:
      # The game, kept current at every start; the files below sit on top of it.
      - tf2-server-game:/data
      - ./scripts/start-server.sh:/start-server.sh:ro
      - ./scripts/update-game.sh:/update-game.sh:ro
      # The health check: A2S_INFO to the game port (see healthcheck: below).
      - ./tools/healthcheck.sh:/healthcheck.sh:ro
      # Linked into tf/cfg and tf/custom by scripts/start-server.sh.
      - ./server.cfg:/config/server.cfg:ro
      - ./mapcycle.txt:/config/mapcycle.txt:ro
      # Navigation meshes for maps that ship without one. Bots cannot move on a
      # map that has no mesh; they spawn and stand there. Generate one on a
      # local client with `nav_generate` and drop the .nav files here.
      - ./navs:/config/navs:ro
    healthcheck:
      # THE GAME'S OWN ANSWER, NOT ITS PROCESS. tools/healthcheck.sh sends
      # A2S_INFO, the query every server browser sends, to the game port and is
      # healthy only on the engine's reply. Up to v2.0.4 this looked for
      # srcds_linux64 in /proc: a hung or stopped game keeps its process, and
      # on Docker Engine 29.4.2 Black Mesa's srcds ran with no socket at all
      # and stayed healthy. An empty server hibernates and logs nothing for
      # hours, and still answers, so the log is not read either. A map change
      # silences it for seconds; the check tries twice and Docker allows three
      # misses at this interval. Each check ends within 7 seconds.
      # It asks from inside the container: it does not prove the port is
      # published on the host or open in a firewall.
      # tests/e2e-healthcheck.sh runs it in the pinned image; CI stops the real
      # game's process and requires it to go red.
      test: ["CMD", "bash", "/healthcheck.sh", "${TF2_SERVER_PORT:-27015}"]
      interval: 60s
      timeout: 10s
      retries: 3
      # A FIRST START IS A 15 GB DOWNLOAD, NOT A MAP LOAD. A slow link takes
      # far longer than the map, and a check that gave up after three minutes
      # would call a server unhealthy while SteamCMD was still fetching it.
      # The start period only forgives failures: a server that comes up in a
      # minute is healthy in a minute.
      start_period: ${TF2_SERVER_START_PERIOD:-60m}
    # srcds writes its state on the way out. Ten seconds and a SIGKILL is
    # enough to lose the last round.
    stop_grace_period: ${TF2_SERVER_STOP_GRACE_PERIOD:-30s}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${TF2_SERVER_LOG_MAX_SIZE:-10m}
        max-file: "${TF2_SERVER_LOG_MAX_FILE:-3}"

# THE GAME, AND NOTHING ELSE. Everything a person configures is a file in this
# repository, mounted on top of it, so losing the volume costs a download and
# nothing more: `docker compose down -v` deletes it and the next start fetches
# the game again. That is why it is not declared external, as the CS2
# templates' volumes are, where the same 60 GB would come back twice.
volumes:
  tf2-server-game:
