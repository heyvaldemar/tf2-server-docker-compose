// Set here, not on the command line: the launcher loses everything after a
// "|" in an argument, so a hostname passed through .env arrived truncated.
hostname "TF2 Casual 24/7"

// Auto-fill AI bots so the server always feels alive. "fill" keeps tf_bot_quota
// TOTAL players: bots yield slots as humans join, so real players always get
// priority and the server never looks empty in the browser.
tf_bot_quota 6
tf_bot_quota_mode fill
tf_bot_join_after_player 0
tf_bot_difficulty 1
tf_bot_prefix_name_with_difficulty 0
tf_bot_keep_class_after_death 0

// End each map after 25 minutes so the server cycles through mapcycle.txt.
mp_timelimit 25
mp_bonusroundtime 8

// Game log settings.
//
// sv_logflush 1 forces each line to disk. Without it the engine buffers the log
// and flushes only on close, so on a quiet server the file reports zero bytes
// while people are talking and anything reading it sees nothing. A busy server
// fills the buffer on its own, which is exactly why the problem is invisible
// there and shows up on the next, quieter one.
sv_logflush 1
sv_log_onefile 1
log on
sv_logecho 1
