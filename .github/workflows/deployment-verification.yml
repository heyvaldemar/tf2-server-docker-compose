name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: tf2-server
            env_var: TF2_SERVER_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" tf2-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  healthcheck:
    name: The health check, both ways, and the scripts, against stubs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            tests/*.sh tools/*.sh scripts/*.sh update.sh

      - name: The health check goes by the game's answer, in the pinned image
        # tools/healthcheck.sh is healthy only on the engine's reply to
        # A2S_INFO. Run in the pinned image, so its tools are proven there,
        # against a stand-in that answers, answers after a challenge, stays
        # silent, or is not there at all (tests/fixtures/fake-a2s.py). The real
        # game is the boot job below.
        run: |
          chmod +x tests/e2e-healthcheck.sh
          ./tests/e2e-healthcheck.sh

      - name: The Steam check, every branch, against stubbed answers
        run: bash tests/steam-uptodate.sh

      - name: Docker makes the game directory root's, and the update refuses it
        # A container created with working_dir inside the volume leaves that
        # directory owned by root; SteamCMD handed one it cannot write
        # installed into its own library and printed Success
        # (docs/evidence/steamcmd-unwritable-dir.md). Measured here, with the
        # refusal, a plant without it, and a control.
        run: bash tests/unwritable-game-dir.sh

      - name: SteamCMD's "offline" on Docker 29.4.2 is named, and nothing else is blamed on it
        run: bash tests/steamcmd-offline.sh

      - name: Every script in tools/ is read whole before it runs
        run: bash tests/read-whole.sh

      - name: The timer keeps running the night the clocks go back
        run: bash tests/timers.sh

      - name: The compose file parses with the shipped defaults
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f tf2-server-docker-compose.yml config >/dev/null
          echo "compose OK"

  boot:
    name: The game, installed from Steam and called current by Steam
    # THE QUESTION THE OLD CI NEVER ASKED. Up to v1 this workflow linted,
    # scanned and parsed, and stayed green for months over an image whose
    # game Steam no longer accepted. This job installs the game the way a
    # first start does, boots it, and asks Steam about the version the server
    # itself reports over A2S - with tools/steam-uptodate.sh, the script the
    # timer runs. Then it makes the server stale on purpose and has the same
    # script bring it back, so the update path is shown working against the
    # real SteamCMD and the real Steam, not described.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -f tf2-server-docker-compose.yml -p tf2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make room for the game
        # About 15 GB of game and 1.5 GB of image; a runner starts with less
        # free than that on its root disk.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Docker 29.4.2 answers socketcall with ENOSYS; give its daemon the profile 29.4.3 ships
        # Docker Engine 29.4.2, and that release alone, blocks the 32-bit
        # socketcall(2) system call in its default seccomp profile
        # (moby/moby#52506). SteamCMD, a 32-bit program, makes every socket
        # through it, so on 29.4.2 it cannot get online, with Steam and the
        # network both up. 29.4.3 reverted the rule; the ubuntu-26.04 runner
        # image still ships 29.4.2. On that version, and only there, the daemon
        # gets the default profile 29.4.3 ships (moby/profiles seccomp v0.2.3),
        # pinned by commit and checksum. Measured: tf2-server-docker-compose run
        # 42496129688.
        run: |
          v="$(docker version --format '{{.Server.Version}}')"
          if [ "$v" != 29.4.2 ]; then echo "Docker $v: its own profile allows socketcall"; exit 0; fi
          sudo curl -fsSL -o /etc/docker/seccomp-29.4.3.json \
            https://raw.githubusercontent.com/moby/profiles/836ae4d37ef2ec995c77c99fc55f5b5f3af3a897/seccomp/default.json
          echo "536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  /etc/docker/seccomp-29.4.3.json" | sha256sum -c -
          f=/etc/docker/daemon.json
          [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"seccomp-profile": "/etc/docker/seccomp-29.4.3.json"}' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker
          docker info --format '{{.SecurityOptions}}'

      - name: First start - the game is downloaded into the volume
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          # Two different random secrets, so the command-line check below
          # looks for values nothing else on the runner could hold.
          sed -i -E "s/^TF2_SERVER_RCON_PASSWORD=.*/TF2_SERVER_RCON_PASSWORD=$(openssl rand -hex 16)/; s/^TF2_SERVER_STEAM_TOKEN=.*/TF2_SERVER_STEAM_TOKEN=$(openssl rand -hex 16)/" .env
          start=$(date +%s)
          $COMPOSE up -d
          # The server's start script downloads the game before srcds; its
          # outcome is the last "tf2-update:" line in the log.
          for _ in $(seq 1 120); do
            line="$($COMPOSE logs --no-log-prefix tf2-server | grep -a '^tf2-update:' | tail -1)"
            case $line in
              *"updated build"*|*"is current"*) break ;;
              *"there is no game"*|*FAILED*) break ;;
            esac
            sleep 15
          done
          $COMPOSE logs --no-log-prefix tf2-server | grep -a '^tf2-update:'
          echo "install finished $(( $(date +%s) - start )) s after up -d"
          [[ $line == *"updated build"* ]] || { echo "::error::the first start did not install the game"; $COMPOSE logs --tail 40 tf2-server; exit 1; }
          $COMPOSE exec -T tf2-server sh -c 'du -sh /data/tf2; stat -c "%U:%G %n" /data/tf2 /data/tf2/steamapps/appmanifest_232250.acf; ls -l /data/tf2/tf/cfg/server.cfg /data/tf2/tf/custom/navs'

      - name: Wait for the health check to go green
        run: |
          cid="$($COMPOSE ps -q tf2-server)"
          for _ in $(seq 1 60); do
            s="$(docker inspect "$cid" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
            echo "health: $s"
            [ "$s" = healthy ] && exit 0
            [ "$s" = unhealthy ] && break
            sleep 10
          done
          echo "::error::the server never reported healthy"
          $COMPOSE logs --tail 80
          echo "--- the health check's own words, last runs"
          docker inspect "$cid" --format '{{range .State.Health.Log}}exit {{.ExitCode}}: {{.Output}}{{end}}' | tail -c 2000
          echo "--- UDP sockets in the container"
          docker exec "$cid" cat /proc/net/udp
          exit 1

      - name: Steam calls the server current
        # --check: 0 current, 1 behind, 3 no answer yet (the map is still
        # loading). Healthy is not listening, so "no answer" is retried.
        run: |
          for attempt in $(seq 1 40); do
            rc=0; tools/steam-uptodate.sh --check || rc=$?
            [ "$rc" = 3 ] || exit "$rc"
            echo "attempt $attempt: not answering yet"
            sleep 10
          done
          $COMPOSE logs --tail 80 tf2-server
          exit 3

      - name: Neither the token nor the RCON password is on a command line
        # srcds kept both in its arguments for as long as it ran, where every
        # user on the host reads them with ps; scripts/start-server.sh writes
        # them into tf/cfg/secrets.cfg instead. Every command line on the
        # runner and in the container is read, compared through a file
        # holding the two values, so neither is ever printed.
        run: |
          vals="$(mktemp)"; chmod 600 "$vals"
          sed -n -E 's/^(TF2_SERVER_RCON_PASSWORD|TF2_SERVER_STEAM_TOKEN)=//p' .env > "$vals"
          [ "$(grep -c . "$vals")" = 2 ] || { echo "::error::could not read both values from .env"; exit 1; }
          srcds="$(ps -eo comm=,args= | awk '$1 ~ /^srcds/ { $1 = ""; sub(/^ /, ""); print }')"
          # shellcheck disable=SC2009  # every command line on the runner, not one process
          host=$(ps -eo args= | grep -cF -f "$vals" || true)
          # shellcheck disable=SC2016  # expanded by the container's shell
          ctr=$($COMPOSE exec -T tf2-server sh -c 'for f in /proc/[0-9]*/cmdline; do tr "\000" " " < "$f" 2>/dev/null; echo; done' | grep -cF -f "$vals" || true)
          rm -f "$vals"
          [ -n "$srcds" ] || { echo "::error::no srcds process on the runner to read"; exit 1; }
          echo "command lines carrying the token or the password: $host on the runner, $ctr in the container"
          [ "$host" = 0 ] && [ "$ctr" = 0 ] || { echo "::error::a secret is on a command line"; exit 1; }
          printf '%s\n' "$srcds" | sed 's/^/  srcds: /'
          $COMPOSE exec -T tf2-server stat -c '%a %U %n' /data/tf2/tf/cfg/secrets.cfg
          $COMPOSE logs --no-log-prefix tf2-server | grep -a 'secrets.cfg' | head -3 \
            || { echo "::error::the server log never mentions secrets.cfg: was it executed?"; exit 1; }

      - name: rcon answers, and refuses a wrong password
        run: |
          out="$(tools/rcon.sh status)"; printf '%s\n' "$out" | head -5
          grep -q '^hostname' <<<"$out" || { echo "::error::status did not return the hostname line"; exit 1; }
          cp .env .env.good
          sed -i 's/^TF2_SERVER_RCON_PASSWORD=.*/TF2_SERVER_RCON_PASSWORD=not-the-password/' .env
          rc=0; tools/rcon.sh status || rc=$?
          mv .env.good .env
          [ "$rc" = 2 ] || { echo "::error::a wrong password was not refused (exit $rc)"; exit 1; }
          echo "a wrong password: refused, exit 2"

      - name: The health check answers again after a map change
        # A changelevel silences A2S_INFO while the next map loads. The check
        # must answer again within two minutes, on the new map, and Docker's
        # status (three misses at a 60-second interval) must stay healthy.
        run: |
          cid="$($COMPOSE ps -q tf2-server)"
          docker exec "$cid" bash /healthcheck.sh 27015
          tools/rcon.sh changelevel ctf_2fort >/dev/null
          t0=$SECONDS; misses=0; ok=""
          while [ $((SECONDS - t0)) -lt 120 ]; do
            if docker exec "$cid" bash /healthcheck.sh 27015 >/dev/null 2>&1; then
              [ $((SECONDS - t0)) -ge 15 ] && { ok=1; break; }
            else
              misses=$((misses + 1))
            fi
            sleep 2
          done
          map="$(tools/rcon.sh status | sed -n 's/^map *: *\([^ ]*\).*/\1/p')"
          s="$(docker inspect "$cid" --format '{{.State.Health.Status}}')"
          echo "after changelevel: map ${map:-?}, $misses missed checks, answering at $((SECONDS - t0))s, docker health: $s"
          [ "$ok" = 1 ] || { echo "::error::the game did not answer again within two minutes of the map change"; exit 1; }
          [ "$map" = ctf_2fort ] || { echo "::error::the map did not change, so this proved nothing"; exit 1; }
          [ "$s" = healthy ] || { echo "::error::docker called it $s across a map change"; exit 1; }

      - name: Plant - a stopped game keeps its process, and the check goes red
        # The check up to v2.0.4 looked for srcds_linux64 in /proc. SIGSTOP
        # leaves the process there and the game deaf: that check must still
        # pass and this one fail; after SIGCONT this one passes again.
        run: |
          cid="$($COMPOSE ps -q tf2-server)"
          # shellcheck disable=SC2016  # expanded by the container's shell
          pid="$(docker exec "$cid" sh -c 'for p in /proc/[0-9]*; do [ "$(cat "$p/comm" 2>/dev/null)" = srcds_linux64 ] && echo "${p#/proc/}"; done' | head -1)"
          [ -n "$pid" ] || { echo "::error::no srcds_linux64 process to stop"; exit 1; }
          docker exec "$cid" sh -c "kill -STOP $pid"
          o=0; docker exec "$cid" sh -c "grep -qsE '^srcds_linux(64)?\$' /proc/[0-9]*/comm" || o=$?
          n=0; docker exec "$cid" bash /healthcheck.sh 27015 || n=$?
          docker exec "$cid" sh -c "kill -CONT $pid"
          echo "game stopped: the old check exits $o, the new one $n"
          [ "$o" = 0 ] && [ "$n" = 1 ] || { echo "::error::expected the old check to pass (0) and the new one to fail (1)"; exit 1; }
          for _ in $(seq 1 15); do
            docker exec "$cid" bash /healthcheck.sh 27015 && exit 0
            sleep 2
          done
          echo "::error::the game did not answer again after SIGCONT"; exit 1

      - name: Plant - a stale version turns the check red
        # The version an August 2026 image carried, and an older build in the
        # app manifest: what a server left behind by Valve looks like. Only
        # the game process is restarted, by its wrapper, the way a server keeps
        # running when Valve ships a build: a container restart would update
        # it before srcds came back.
        run: |
          $COMPOSE exec -T tf2-server sh -c '
            cd /data/tf2
            sed -i -E "s/^(ClientVersion|ServerVersion|PatchVersion)=.*/\1=10828683/" tf/steam.inf
            sed -i -E "s/(\"buildid\"[[:space:]]+\")[0-9]+/\11/" steamapps/appmanifest_232250.acf
            grep -E "Version=" tf/steam.inf'
          $COMPOSE exec -T tf2-server pkill -x srcds_linux64
          # Until the restarted game answers: the old process may still answer
          # current for a few seconds, and a restarting one not at all.
          for _ in $(seq 1 40); do
            rc=0; tools/steam-uptodate.sh --check || rc=$?
            [ "$rc" = 1 ] && break
            sleep 10
          done
          [ "$rc" = 1 ] || { echo "::error::the stale server was not called out of date (exit $rc)"; exit 1; }

      - name: The timer's script brings it back, and Steam agrees
        run: |
          rc=0; tools/steam-uptodate.sh || rc=$?
          $COMPOSE logs --no-log-prefix tf2-server | grep -a '^tf2-update:' | tail -2
          [ "$rc" = 0 ] || { echo "::error::the update did not take (exit $rc)"; exit 1; }
          tools/steam-uptodate.sh --check

      - name: Stop
        if: always()
        run: $COMPOSE down -v --remove-orphans
